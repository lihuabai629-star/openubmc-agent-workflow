name: ChatGPT app validation

on:
  pull_request:
    paths:
      - "chatgpt-app/**"
      - ".github/workflows/chatgpt-app.yml"
  push:
    branches: [main]
    paths:
      - "chatgpt-app/**"
      - ".github/workflows/chatgpt-app.yml"

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chatgpt-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: chatgpt-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: npm test
