name: Release

on:
  workflow_dispatch:
    inputs:
      current_ref:
        description: Immutable release tag to validate and publish
        required: true
        type: string
      previous_ref:
        description: Previous immutable release tag used for upgrade and rollback
        required: true
        type: string
      ab_summary_base64:
        description: Base64-encoded execute AB summary.json
        required: true
        type: string
      ab_metrics_base64:
        description: Base64-encoded execute AB all_metrics.json
        required: true
        type: string
      ab_schedule_base64:
        description: Base64-encoded execute AB schedule.json
        required: true
        type: string
      promote:
        description: Create the GitHub Release after every gate passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.current_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Restore execute AB qualification evidence
        env:
          AB_SUMMARY_BASE64: ${{ inputs.ab_summary_base64 }}
          AB_METRICS_BASE64: ${{ inputs.ab_metrics_base64 }}
          AB_SCHEDULE_BASE64: ${{ inputs.ab_schedule_base64 }}
        run: |
          mkdir -p agent-gateway-ab-evidence
          printf '%s' "$AB_SUMMARY_BASE64" | base64 --decode > agent-gateway-ab-evidence/summary.json
          printf '%s' "$AB_METRICS_BASE64" | base64 --decode > agent-gateway-ab-evidence/all_metrics.json
          printf '%s' "$AB_SCHEDULE_BASE64" | base64 --decode > agent-gateway-ab-evidence/schedule.json

      - name: Run immutable release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release_gate.py
          --current-ref "${{ inputs.current_ref }}"
          --previous-ref "${{ inputs.previous_ref }}"
          --ab-evidence agent-gateway-ab-evidence/summary.json
          --output release-gate.json

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ inputs.current_ref }}
          path: release-gate.json
          if-no-files-found: error

  promote:
    if: ${{ inputs.promote }}
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.current_ref }}
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_REF: ${{ inputs.current_ref }}
        run: gh release view "$CURRENT_REF" >/dev/null 2>&1 || gh release create "$CURRENT_REF" --verify-tag --generate-notes
