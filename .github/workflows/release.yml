name: Release

on:
  workflow_dispatch:
    inputs:
      current_ref:
        description: Immutable release tag to validate and publish
        required: true
        type: string
      previous_ref:
        description: Previous immutable release tag used for upgrade and rollback
        required: true
        type: string
      ab_bundle_base64:
        description: Base64-encoded gzip tar of summary.json, all_metrics.json, and schedule.json
        required: true
        type: string
      ab_bundle_sha256:
        description: SHA-256 of the compressed execute AB evidence bundle
        required: true
        type: string
      promote:
        description: Create the GitHub Release after every gate passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  checks: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.current_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Restore execute AB qualification evidence
        env:
          AB_BUNDLE_BASE64: ${{ inputs.ab_bundle_base64 }}
          AB_BUNDLE_SHA256: ${{ inputs.ab_bundle_sha256 }}
        run: |
          mkdir -p agent-gateway-ab-evidence
          printf '%s' "$AB_BUNDLE_BASE64" | base64 --decode > agent-gateway-ab-evidence.tar.gz
          printf '%s  %s\n' "$AB_BUNDLE_SHA256" agent-gateway-ab-evidence.tar.gz | sha256sum --check --strict
          test "$(tar --list --gzip --file agent-gateway-ab-evidence.tar.gz | LC_ALL=C sort)" = "$(printf '%s\n' all_metrics.json schedule.json summary.json)"
          tar --extract --gzip --file agent-gateway-ab-evidence.tar.gz \
            --directory agent-gateway-ab-evidence \
            --no-same-owner \
            --no-same-permissions \
            summary.json all_metrics.json schedule.json

      - name: Run immutable release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release_gate.py
          --current-ref "${{ inputs.current_ref }}"
          --previous-ref "${{ inputs.previous_ref }}"
          --github-repository "${{ github.repository }}"
          --work-root release-gate-work
          --ab-evidence agent-gateway-ab-evidence/summary.json
          --output release-gate.json

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ inputs.current_ref }}
          path: |
            agent-gateway-ab-evidence/summary.json
            agent-gateway-ab-evidence/all_metrics.json
            agent-gateway-ab-evidence/schedule.json
            agent-gateway-ab-evidence.tar.gz
            release-gate.json
            release-gate-work/github-ci-evidence.json
            release-gate-work/runtime-qualification.json
          if-no-files-found: error

  promote:
    if: ${{ inputs.promote }}
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.current_ref }}
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_REF: ${{ inputs.current_ref }}
        run: gh release view "$CURRENT_REF" >/dev/null 2>&1 || gh release create "$CURRENT_REF" --verify-tag --generate-notes
