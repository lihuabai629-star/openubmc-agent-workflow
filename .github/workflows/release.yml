name: Release

on:
  workflow_dispatch:
    inputs:
      current_ref:
        description: Immutable release tag to validate and publish
        required: true
        type: string
      previous_ref:
        description: Previous immutable release tag used for upgrade and rollback
        required: true
        type: string
      ab_bundle_asset:
        description: Evidence asset attached to the draft release for current_ref
        required: true
        type: string
      ab_bundle_sha256:
        description: SHA-256 of the compressed execute AB evidence bundle
        required: true
        type: string
      promote:
        description: Create the GitHub Release after every gate passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.current_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"

      - name: Restore execute AB qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_REF: ${{ inputs.current_ref }}
          AB_BUNDLE_ASSET: ${{ inputs.ab_bundle_asset }}
          AB_BUNDLE_SHA256: ${{ inputs.ab_bundle_sha256 }}
        run: |
          test -n "$AB_BUNDLE_ASSET"
          gh release download "$CURRENT_REF" \
            --pattern "$AB_BUNDLE_ASSET" \
            --output "$RUNNER_TEMP/agent-gateway-ab-evidence.tar.xz"
          printf '%s  %s\n' "$AB_BUNDLE_SHA256" "$RUNNER_TEMP/agent-gateway-ab-evidence.tar.xz" | sha256sum --check --strict
          python3 scripts/restore_ab_bundle.py \
            --archive "$RUNNER_TEMP/agent-gateway-ab-evidence.tar.xz" \
            --destination "$RUNNER_TEMP/agent-gateway-ab-evidence"

      - name: Restore AB attestation trust root
        env:
          AB_ATTESTATION_PUBLIC_KEY_BASE64: ${{ vars.AB_ATTESTATION_PUBLIC_KEY_BASE64 }}
        run: |
          test -n "$AB_ATTESTATION_PUBLIC_KEY_BASE64"
          printf '%s' "$AB_ATTESTATION_PUBLIC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/agent-gateway-ab-attestation.pub"
          ssh-keygen -lf "$RUNNER_TEMP/agent-gateway-ab-attestation.pub" -E sha256

      - name: Run immutable release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release_gate.py
          --current-ref "${{ inputs.current_ref }}"
          --previous-ref "${{ inputs.previous_ref }}"
          --github-repository "${{ github.repository }}"
          --work-root "$RUNNER_TEMP/release-gate-work"
          --ab-evidence "$RUNNER_TEMP/agent-gateway-ab-evidence/summary.json"
          --ab-attestation-public-key "$RUNNER_TEMP/agent-gateway-ab-attestation.pub"
          --output "$RUNNER_TEMP/release-gate.json"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ inputs.current_ref }}
          path: |
            ${{ runner.temp }}/agent-gateway-ab-evidence/summary.json
            ${{ runner.temp }}/agent-gateway-ab-evidence/all_metrics.json
            ${{ runner.temp }}/agent-gateway-ab-evidence/run_evidence.json
            ${{ runner.temp }}/agent-gateway-ab-evidence/schedule.json
            ${{ runner.temp }}/agent-gateway-ab-evidence.tar.xz
            ${{ runner.temp }}/release-gate.json
            ${{ runner.temp }}/release-gate-work/github-ci-evidence.json
            ${{ runner.temp }}/release-gate-work/runtime-qualification.json
          if-no-files-found: error

  promote:
    if: ${{ inputs.promote }}
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.current_ref }}
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_REF: ${{ inputs.current_ref }}
        run: |
          gh release view "$CURRENT_REF" --json isDraft --jq .isDraft | grep -qx true
          gh release edit "$CURRENT_REF" --draft=false --latest
