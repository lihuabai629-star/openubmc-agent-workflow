name: Release

on:
  workflow_dispatch:
    inputs:
      current_ref:
        description: Checked-out immutable release candidate ref
        required: true
        type: string
      previous_ref:
        description: Previous immutable release tag used for upgrade and rollback
        required: true
        type: string
      model_identity:
        description: JSON identity of the model that produced the formal release evidence
        required: true
        type: string
      codex_identity:
        description: JSON identity of the Codex client that produced the formal release evidence
        required: true
        type: string
      ab_bundle_asset:
        description: Evidence asset attached to the draft release for current_ref
        required: true
        type: string
      ab_bundle_sha256:
        description: SHA-256 of the compressed execute AB evidence bundle
        required: true
        type: string
      promote:
        description: Create the GitHub Release after every gate passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.candidate.outputs.release_tag }}
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.current_ref == 'HEAD' && github.sha || inputs.current_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json

      - name: Install locked Node validation dependencies
        run: npm ci --no-audit --no-fund --prefix openubmc-kb-mcp

      - name: Resolve release candidate identity
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.current_ref }}
        run: |
          RELEASE_COMMIT=$(git rev-parse "${REQUESTED_REF}^{commit}")
          test "$RELEASE_COMMIT" = "$(git rev-parse HEAD^{commit})"
          release_tags=()
          while IFS= read -r tag; do
            if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
              release_tags+=("$tag")
            fi
          done < <(git tag --points-at "$RELEASE_COMMIT")
          RELEASE_TAG=""
          for tag in "${release_tags[@]}"; do
            if test "$tag" = "$REQUESTED_REF"; then
              RELEASE_TAG="$tag"
            fi
          done
          if test -z "$RELEASE_TAG" && test "${#release_tags[@]}" -eq 1; then
            RELEASE_TAG="${release_tags[0]}"
          fi
          if test -z "$RELEASE_TAG"; then
            echo "candidate $RELEASE_COMMIT must have exactly one GitHub Release tag" >&2
            exit 2
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Restore execute AB qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
          AB_BUNDLE_ASSET: ${{ inputs.ab_bundle_asset }}
          AB_BUNDLE_SHA256: ${{ inputs.ab_bundle_sha256 }}
        run: |
          test -n "$AB_BUNDLE_ASSET"
          gh release download "$RELEASE_TAG" \
            --pattern "$AB_BUNDLE_ASSET" \
            --output "$RUNNER_TEMP/agent-gateway-ab-evidence.tar.xz"
          printf '%s  %s\n' "$AB_BUNDLE_SHA256" "$RUNNER_TEMP/agent-gateway-ab-evidence.tar.xz" | sha256sum --check --strict
          python3 scripts/restore_ab_bundle.py \
            --archive "$RUNNER_TEMP/agent-gateway-ab-evidence.tar.xz" \
            --destination "$RUNNER_TEMP/agent-gateway-ab-evidence"

      - name: Restore AB attestation trust root
        env:
          AB_ATTESTATION_PUBLIC_KEY_BASE64: ${{ vars.AB_ATTESTATION_PUBLIC_KEY_BASE64 }}
        run: |
          test -n "$AB_ATTESTATION_PUBLIC_KEY_BASE64"
          printf '%s' "$AB_ATTESTATION_PUBLIC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/agent-gateway-ab-attestation.pub"
          ssh-keygen -lf "$RUNNER_TEMP/agent-gateway-ab-attestation.pub" -E sha256

      - name: Run immutable release gates
        env:
          GH_TOKEN: ${{ github.token }}
          FORMAL_MODEL_IDENTITY: ${{ inputs.model_identity }}
          FORMAL_CODEX_IDENTITY: ${{ inputs.codex_identity }}
        run: >-
          python3 scripts/release_gate.py
          --current-ref "${{ inputs.current_ref }}"
          --release-tag "${{ steps.candidate.outputs.release_tag }}"
          --previous-ref "${{ inputs.previous_ref }}"
          --model-identity "$FORMAL_MODEL_IDENTITY"
          --codex-identity "$FORMAL_CODEX_IDENTITY"
          --github-repository "${{ github.repository }}"
          --work-root "$RUNNER_TEMP/release-gate-work"
          --ab-evidence "$RUNNER_TEMP/agent-gateway-ab-evidence/summary.json"
          --ab-attestation-public-key "$RUNNER_TEMP/agent-gateway-ab-attestation.pub"
          --output "$RUNNER_TEMP/release-gate.json"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-${{ inputs.current_ref }}
          path: |
            ${{ runner.temp }}/agent-gateway-ab-evidence/summary.json
            ${{ runner.temp }}/agent-gateway-ab-evidence/all_metrics.json
            ${{ runner.temp }}/agent-gateway-ab-evidence/run_evidence.json
            ${{ runner.temp }}/agent-gateway-ab-evidence/schedule.json
            ${{ runner.temp }}/agent-gateway-ab-evidence.tar.xz
            ${{ runner.temp }}/release-gate.json
            ${{ runner.temp }}/release-gate-work/github-ci-evidence.json
            ${{ runner.temp }}/release-gate-work/runtime-qualification.json
            ${{ runner.temp }}/release-gate-work/codex-adoption-qualification.json
          if-no-files-found: error

      - name: Install locked Codex plugin host
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix plugin/host
          echo "$PWD/plugin/host/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Qualify and attach immutable plugin distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
        run: |
          SOURCE_COMMIT=$(python3 -c 'import json; print(json.load(open("release-lock.json"))["source_commit"])')
          python3 scripts/qualify_plugin.py \
            --source-ref "$SOURCE_COMMIT" \
            --archive "$RUNNER_TEMP/openubmc-$RELEASE_TAG-codex.tar.gz" \
            --output "$RUNNER_TEMP/plugin-qualification.json"
          cd "$RUNNER_TEMP"
          sha256sum "openubmc-$RELEASE_TAG-codex.tar.gz" > "openubmc-$RELEASE_TAG-codex.sha256"
          gh release upload "$RELEASE_TAG" --repo "${{ github.repository }}" --clobber \
            "openubmc-$RELEASE_TAG-codex.tar.gz" \
            "openubmc-$RELEASE_TAG-codex.sha256" \
            plugin-qualification.json

  windows-plugin-gate:
    needs: release-gate
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-gate.outputs.release_tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"

      - name: Install locked Codex plugin host
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix plugin/host

      - name: Download and install the released package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-gate.outputs.release_tag }}
        run: |
          $asset = "openubmc-$env:RELEASE_TAG-codex.tar.gz"
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $asset --dir $env:RUNNER_TEMP
          $market = Join-Path $env:RUNNER_TEMP "openubmc-release-marketplace"
          New-Item -ItemType Directory -Force -Path (Join-Path $market "plugins") | Out-Null
          tar -xf (Join-Path $env:RUNNER_TEMP $asset) -C (Join-Path $market "plugins")
          New-Item -ItemType Directory -Force -Path (Join-Path $market ".agents/plugins") | Out-Null
          '{"name":"windows-release","plugins":[{"name":"openubmc","source":{"source":"local","path":"./plugins/openubmc"}}]}' | Set-Content -Encoding utf8NoBOM (Join-Path $market ".agents/plugins/marketplace.json")
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-home"
          New-Item -ItemType Directory -Force -Path $env:CODEX_HOME | Out-Null
          $codex = Resolve-Path "plugin/host/node_modules/.bin/codex.cmd"
          & $codex plugin marketplace add $market
          & $codex plugin add openubmc@windows-release --json
          $servers = (& $codex mcp list --json | ConvertFrom-Json)
          foreach ($name in @("openubmc-target-runtime", "openubmc-kb")) {
            $server = $servers | Where-Object { $_.name -eq $name }
            if ($null -eq $server -or $server.transport.command -ne "node") { throw "released Windows launcher missing for $name" }
          }
          $plugin = Join-Path $market "plugins/openubmc"
          $env:OPENUBMC_PLUGIN_HOST_PLATFORM = "win32"
          $env:OPENUBMC_PLUGIN_WSL_EXE = Join-Path $env:RUNNER_TEMP "missing-wsl.exe"
          $request = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          )
          $responses = $request | node (Join-Path $plugin "scripts/openubmc-mcp-bootstrap.js") runtime
          if ((($responses[0] | ConvertFrom-Json).result.serverInfo.name) -ne "openubmc-runtime-setup") { throw "released setup mode failed" }

  promote:
    if: ${{ inputs.promote }}
    needs: [release-gate, windows-plugin-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-gate.outputs.release_tag }}
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-gate.outputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -qx true
          gh release edit "$RELEASE_TAG" --draft=false --latest
