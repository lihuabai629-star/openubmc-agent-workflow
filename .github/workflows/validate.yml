name: Workflow validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-contract:
    name: CI contract preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"

      - name: Install locked Python validation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: >-
          python -m pip install --only-binary=:all:
          --require-hashes --requirement requirements-ci.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json

      - name: Report locked toolchain
        run: |
          python --version
          node --version
          npm --version
          test -f openubmc-kb-mcp/package-lock.json

      - name: Validate CI contract
        run: python -m unittest scripts.tests.test_continuous_validation_workflow

  validate:
    name: Complete repository validation
    needs: ci-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"

      - name: Install locked Python validation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: >-
          python -m pip install --only-binary=:all:
          --require-hashes --requirement requirements-ci.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json

      - name: Report locked toolchain
        run: |
          python --version
          node --version
          npm --version
          test -f openubmc-kb-mcp/package-lock.json

      - name: Run complete repository validation
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/validate_workflow.py

      - name: Run sanitized session replay regressions
        run: python scripts/sanitized_replay.py evaluation/sanitized-replays

      - name: Validate local configuration in Chromium
        working-directory: openubmc-environment-setup/tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

      - name: Install locked Codex plugin host
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix plugin/host
          echo "$PWD/plugin/host/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Test plugin activation recovery with native Codex
        run: python -m unittest scripts.tests.test_plugin_package scripts.tests.test_plugin_activation scripts.tests.test_plugin_credentials scripts.tests.test_plugin_disable_migration scripts.tests.test_plugin_agent_guidance

      - name: Qualify immutable Codex plugin
        run: >-
          python scripts/qualify_plugin.py
          --archive "$RUNNER_TEMP/openubmc-plugin.tar.gz"
          --output "$RUNNER_TEMP/plugin-qualification.json"

      - name: Upload plugin qualification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-plugin-qualification
          path: ${{ runner.temp }}/plugin-qualification.json
          if-no-files-found: error

  windows-plugin:
    name: Windows marketplace bootstrap
    needs: ci-contract
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"

      - name: Install locked Codex plugin host
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix plugin/host

      - name: Build and install the marketplace package
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "openubmc-plugin.tar.gz"
          python scripts/package_plugin.py build --source . --source-ref HEAD --output $archive
          $market = Join-Path $env:RUNNER_TEMP "openubmc-marketplace"
          New-Item -ItemType Directory -Force -Path (Join-Path $market "plugins") | Out-Null
          tar -xf $archive -C (Join-Path $market "plugins")
          New-Item -ItemType Directory -Force -Path (Join-Path $market ".agents/plugins") | Out-Null
          '{"name":"windows-test","plugins":[{"name":"openubmc","source":{"source":"local","path":"./plugins/openubmc"}}]}' | Set-Content -Encoding utf8NoBOM (Join-Path $market ".agents/plugins/marketplace.json")
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-home"
          New-Item -ItemType Directory -Force -Path $env:CODEX_HOME | Out-Null
          $codex = Resolve-Path "plugin/host/node_modules/.bin/codex.cmd"
          & $codex plugin marketplace add $market
          & $codex plugin add openubmc@windows-test --json
          $servers = (& $codex mcp list --json | ConvertFrom-Json)
          foreach ($name in @("openubmc-target-runtime", "openubmc-kb")) {
            $server = $servers | Where-Object { $_.name -eq $name }
            if ($null -eq $server -or $server.transport.command -ne "node") { throw "Windows MCP launcher was not installed for $name" }
          }

      - name: Verify setup-mode MCP initialization without WSL
        shell: pwsh
        run: |
          $plugin = Join-Path $env:RUNNER_TEMP "openubmc-marketplace/plugins/openubmc"
          $env:OPENUBMC_PLUGIN_HOST_PLATFORM = "win32"
          $env:OPENUBMC_PLUGIN_WSL_EXE = Join-Path $env:RUNNER_TEMP "missing-wsl.exe"
          $request = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}',
            '{"jsonrpc":"2.0","method":"notifications/initialized"}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          )
          $responses = $request | node (Join-Path $plugin "scripts/openubmc-mcp-bootstrap.js") runtime
          $initialize = $responses[0] | ConvertFrom-Json
          $tools = $responses[1] | ConvertFrom-Json
          if ($initialize.result.serverInfo.name -ne "openubmc-runtime-setup") { throw "setup initialize failed" }
          if (($tools.result.tools.name -notcontains "openubmc_setup_status")) { throw "setup tools unavailable" }
