name: Workflow validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-contract:
    name: CI contract preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"

      - name: Install locked Python validation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: >-
          python -m pip install --only-binary=:all:
          --require-hashes --requirement requirements-ci.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json

      - name: Report locked toolchain
        run: |
          python --version
          node --version
          npm --version
          test -f openubmc-kb-mcp/package-lock.json

      - name: Validate CI contract
        run: python -m unittest scripts.tests.test_continuous_validation_workflow

  validate:
    name: Complete repository validation
    needs: ci-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"

      - name: Install locked Python validation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: >-
          python -m pip install --only-binary=:all:
          --require-hashes --requirement requirements-ci.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json

      - name: Report locked toolchain
        run: |
          python --version
          node --version
          npm --version
          test -f openubmc-kb-mcp/package-lock.json

      - name: Run complete repository validation
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/validate_workflow.py
