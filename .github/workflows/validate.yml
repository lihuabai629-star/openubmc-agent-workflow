name: Workflow validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-contract:
    name: CI contract preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install locked Python validation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: >-
          python -m pip install --only-binary=:all:
          --require-hashes --requirement requirements-ci.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json

      - name: Report locked toolchain
        run: |
          python --version
          node --version
          npm --version
          test -f openubmc-kb-mcp/package-lock.json

      - name: Validate CI contract
        run: python -m unittest scripts.tests.test_continuous_validation_workflow

  validate:
    name: Runtime Core repository validation
    needs: ci-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install locked Python validation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: >-
          python -m pip install --only-binary=:all:
          --require-hashes --requirement requirements-ci.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json

      - name: Report locked toolchain
        run: |
          python --version
          node --version
          npm --version
          test -f openubmc-kb-mcp/package-lock.json

      - name: Run complete repository validation
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/validate_workflow.py

  diagnose-debug-root:
    name: Debug test - ${{ matrix.test }}
    needs: ci-contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_debug_credential_bundle.py
          - test_dual_target_comparison.py
          - test_internal_development_mode.py
          - test_multi_target_comparison.py
          - test_object_alarm_lane_contract.py
          - test_object_alarm_runtime_adapter.py
          - test_preflight_compatibility.py
          - test_runtime_mcp_backend.py
          - test_runtime_vendoring.py
          - test_ssh_control_master.py
          - test_target_runtime_cli.py
          - test_telnet_runtime_adapter.py
          - test_typed_debug_run.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - run: python -m unittest discover -s openubmc-debug/tests -p '${{ matrix.test }}'

  diagnose-environment-root:
    name: Python root - openubmc-environment-setup/tests
    needs: ci-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json
      - run: python -m unittest discover -s openubmc-environment-setup/tests -p 'test_*.py'
