name: Workflow validation

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/run-engine-core

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-validator-mode:
    if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/run-engine-core'
    name: Restore validator executable mode
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/run-engine-core
      - name: Restore executable mode when required
        run: |
          if test -x scripts/validate_workflow.py; then
            exit 0
          fi
          chmod +x scripts/validate_workflow.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate_workflow.py
          git commit -m "fix: restore workflow validator executable mode"
          git push origin HEAD:refactor/run-engine-core

  ci-contract:
    name: CI contract preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install locked Python validation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: >-
          python -m pip install --only-binary=:all:
          --require-hashes --requirement requirements-ci.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json

      - name: Report locked toolchain
        run: |
          python --version
          node --version
          npm --version
          test -f openubmc-kb-mcp/package-lock.json

      - name: Validate CI contract
        run: python -m unittest scripts.tests.test_continuous_validation_workflow

  validate:
    name: Runtime Core repository validation
    needs: ci-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install locked Python validation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: >-
          python -m pip install --only-binary=:all:
          --require-hashes --requirement requirements-ci.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json

      - name: Report locked toolchain
        run: |
          python --version
          node --version
          npm --version
          test -f openubmc-kb-mcp/package-lock.json

      - name: Run complete repository validation
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/validate_workflow.py

  diagnose-debug-root:
    name: Python root - openubmc-debug/tests
    needs: ci-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - run: python -m unittest discover -s openubmc-debug/tests -p 'test_*.py'

  diagnose-environment-root:
    name: Python root - openubmc-environment-setup/tests
    needs: ci-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json
      - run: python -m unittest discover -s openubmc-environment-setup/tests -p 'test_*.py'

  diagnose-node:
    name: Node stages - openubmc-kb-mcp
    needs: ci-contract
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: openubmc-kb-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
