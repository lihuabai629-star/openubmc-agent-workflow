name: Workflow validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-contract:
    name: CI contract preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12.13"

      - name: Install locked Python validation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: >-
          python -m pip install --only-binary=:all:
          --require-hashes --requirement requirements-ci.lock

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json

      - name: Report locked toolchain
        run: |
          python --version
          node --version
          npm --version
          test -f openubmc-kb-mcp/package-lock.json

      - name: Validate CI contract
        run: python -m unittest scripts.tests.test_continuous_validation_workflow scripts.tests.test_ci_evidence_archive

  validate:
    name: Complete repository validation
    needs: ci-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12.13"

      - name: Install locked Python validation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: >-
          python -m pip install --only-binary=:all:
          --require-hashes --requirement requirements-ci.lock

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: openubmc-kb-mcp/package-lock.json

      - name: Report locked toolchain
        run: |
          python --version
          node --version
          npm --version
          test -f openubmc-kb-mcp/package-lock.json

      - name: Run complete repository validation
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/validate_workflow.py

      - name: Run sanitized session replay regressions
        run: python scripts/sanitized_replay.py evaluation/sanitized-replays

      - name: Validate local configuration in Chromium
        working-directory: openubmc-environment-setup/tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

      - name: Install locked Codex plugin host
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix plugin/host
          echo "$PWD/plugin/host/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Test plugin activation recovery with native Codex
        run: python -m unittest scripts.tests.test_plugin_package scripts.tests.test_plugin_activation scripts.tests.test_plugin_credentials scripts.tests.test_plugin_disable_migration scripts.tests.test_plugin_agent_guidance

      - name: Qualify immutable Codex plugin
        id: qualification
        run: >-
          python scripts/qualify_plugin.py
          --archive "$RUNNER_TEMP/openubmc-plugin.tar.gz"
          --output "$RUNNER_TEMP/plugin-qualification.json"

      - name: Summarize plugin qualification
        if: ${{ !cancelled() }}
        env:
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
        run: |
          printf 'Plugin qualification: %s\n\n' "$QUALIFICATION_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if test -f "$RUNNER_TEMP/plugin-qualification.json"; then
            sha256sum "$RUNNER_TEMP/plugin-qualification.json" >> "$GITHUB_STEP_SUMMARY"
          fi
